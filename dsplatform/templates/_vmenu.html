      {# One control per video, on the profile and on the clip's own page:
         public or private, share it, delete it. Who has it shows underneath. #}
      <div class="vmenu" data-video="{{ v.id }}" data-title="{{ v.title }}">
        <ul class="share-who share-who-card" title="Who can see this one"></ul>
        <button class="vbtn state-{{ 'public' if v.visibility == 'public' else 'private' }}">
          <span class="dot"></span><span class="vlabel">{{ 'Public' if v.visibility == 'public' else 'Private' }}</span><span class="caret">&#9662;</span>
        </button>
        <div class="vpanel">
          <button class="vopt" data-set="public"><span class="dot pub"></span>Public</button>
          <button class="vopt" data-set="private"><span class="dot prv"></span>Private</button>
          <div class="vsep"></div>
          <button class="vshare">Share&hellip;</button>
          <button class="vdel">Delete</button>
          <div class="sharebox">
            <div class="share-title">Share with a dancer</div>
            <div class="share-row">
              <span class="at">@</span><input placeholder="their handle"
                autocapitalize="none" autocorrect="off">
              <button class="share-go">Share</button>
            </div>
            <div class="share-title" style="margin-top:9px">Group share</div>
            <div class="share-row share-group">
              <select class="share-pick"><option value="">choose a group</option></select>
              <button class="share-go share-go-group">Share</button>
            </div>
            <a href="#" class="share-manage">Manage groups&hellip;</a>
            <div class="share-msg"></div>
            <ul class="share-who"></ul>
          </div>
        </div>
      </div>
