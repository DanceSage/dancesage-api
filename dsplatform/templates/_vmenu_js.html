<script>
// ── one menu per video: public/private, share, delete ──────────────────────
// Shared by the profile and the video page. A page that wants to draw its own
// lists on top sets window.renderLedger(grants) / window.renderGroups(groups).
const LABEL = { public: 'Public', private: 'Private' };
let GROUPS = [];
const groupOffers = [];

document.querySelectorAll('.vmenu').forEach(menu => {
  const id     = menu.dataset.video;
  const btn    = menu.querySelector('.vbtn');
  const panel  = menu.querySelector('.vpanel');
  const shareBox = menu.querySelector('.sharebox');
  const input  = menu.querySelector('.sharebox input');
  const msg    = menu.querySelector('.share-msg');
  const who    = menu.querySelector('.sharebox .share-who');
  const pick   = menu.querySelector('.share-pick');

  const close = () => { panel.classList.remove('open'); shareBox.classList.remove('open'); };

  btn.onclick = e => {
    e.stopPropagation();
    const wasOpen = panel.classList.contains('open');
    document.querySelectorAll('.vpanel.open').forEach(p => {
      p.classList.remove('open');
      p.querySelector('.sharebox').classList.remove('open');
    });
    if (!wasOpen) panel.classList.add('open');
  };
  panel.onclick = e => e.stopPropagation();
  document.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  // public or private — sharing is separate, and survives either
  panel.querySelectorAll('.vopt').forEach(opt => {
    opt.onclick = async () => {
      const want = opt.dataset.set;
      const r = await fetch(`/v1/videos/${id}/visibility`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ visibility: want })
      });
      if (!r.ok) return;
      btn.className = 'vbtn state-' + want;
      menu.querySelector('.vlabel').textContent = LABEL[want];
      close();
    };
  });

  // share — a person, or a group; who has it, with a way to take it back
  menu.querySelector('.vshare').onclick = () => {
    shareBox.classList.toggle('open');
    if (shareBox.classList.contains('open')) { refresh(); input.focus(); }
  };
  async function refresh() {
    const r = await fetch('/v1/grants');
    if (!r.ok) return;
    const { grants } = await r.json();
    who.innerHTML = '';
    grants.filter(g => String(g.video_id) === id).forEach(g => {
      const li = document.createElement('li');
      li.innerHTML = `@${g.handle}${g.accepted ? '' : ' · waiting'}<button title="${g.accepted ? 'Revoke' : 'Withdraw'}">&times;</button>`;
      li.querySelector('button').onclick = async () => {
        await fetch(`/v1/grants/${g.id}`, { method: 'DELETE' });
        refresh(); loadGrants();
      };
      who.appendChild(li);
    });
  }
  async function shareWith(body) {
    msg.textContent = '';
    const r = await fetch('/v1/grants', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ video_id: Number(id) }, body))
    });
    if (r.ok) { input.value = ''; refresh(); loadGrants(); }
    else msg.textContent = (await r.json()).detail || 'Could not share it.';
  }
  const addPerson = () => {
    const h = input.value.trim().replace(/^@/, '');
    if (h) shareWith({ handle: h });
  };
  menu.querySelector('.share-go').onclick = addPerson;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addPerson(); });

  function offerGroups() {
    pick.innerHTML = '<option value="">a group…</option>'
      + GROUPS.map(g => `<option value="${g.id}">${g.name} (${g.members.length})</option>`).join('');
  }
  groupOffers.push(offerGroups);
  menu.querySelector('.share-go-group').onclick = () => {
    if (!pick.value) { msg.textContent = GROUPS.length ? 'Pick a group.' : 'No groups yet — press + to make one.'; return; }
    shareWith({ group_id: Number(pick.value) });
  };
  menu.querySelector('.share-new-group').onclick = async () => {
    const name = prompt('Name for the group (a class, a team):');
    if (!name) return;
    const raw = prompt('Their handles, separated by commas:') || '';
    const handles = raw.split(/[,\s]+/).map(h => h.replace(/^@/, '')).filter(Boolean);
    const r = await fetch('/v1/groups', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, handles })
    });
    if (!r.ok) { msg.textContent = (await r.json()).detail || 'Could not create the group.'; return; }
    const g = await r.json();
    await loadGroups();
    pick.value = String(g.id);
  };

  // deletion
  menu.querySelector('.vdel').onclick = async () => {
    if (!confirm(`Delete \u201c${menu.dataset.title}\u201d?\n\n`
      + `The video and its skeleton are removed from Dance Sage. `
      + `Anything saved on your phone is not affected. This cannot be undone.`)) return;
    const r = await fetch(`/v1/videos/${id}`, { method: 'DELETE' });
    if (r.ok) { menu.closest('.card').remove(); loadGrants(); }
    else alert('Could not delete that one.');
  };
});

// ── groups: loaded once, offered to every menu ─────────────────────────────
async function loadGroups() {
  const r = await fetch('/v1/groups');
  if (!r.ok) return;
  GROUPS = (await r.json()).groups;
  groupOffers.forEach(f => f());
  if (window.renderGroups) window.renderGroups(GROUPS);
}
loadGroups();

// ── who has what: chips on every card, and whatever the page adds ─────────
async function loadGrants() {
  const r = await fetch('/v1/grants');
  if (!r.ok) return;
  const { grants } = await r.json();
  document.querySelectorAll('.vmenu').forEach(menu => {
    const ul = menu.querySelector('.share-who-card');
    if (!ul) return;
    const mine = grants.filter(g => String(g.video_id) === menu.dataset.video);
    ul.innerHTML = mine.map(g =>
      `<li title="${g.accepted ? 'can see this' : 'has not accepted yet'}" style="${g.accepted ? '' : 'opacity:.6'}">@${g.handle}${g.accepted ? '' : ' · waiting'}</li>`).join('');
    ul.style.display = mine.length ? '' : 'none';
  });
  if (window.renderLedger) window.renderLedger(grants);
}
loadGrants();
</script>
