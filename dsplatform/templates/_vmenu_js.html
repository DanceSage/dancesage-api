<script>
// ── one menu per video: public/private, share, delete ──────────────────────
// Shared by the profile and the video page. A page that wants to draw its own
// lists on top sets window.renderLedger(grants) / window.renderGroups(groups).
const LABEL = { public: 'Public', private: 'Private' };
let GROUPS = [];
const groupOffers = [];

document.querySelectorAll('.vmenu').forEach(menu => {
  const id     = menu.dataset.video;
  const btn    = menu.querySelector('.vbtn');
  const panel  = menu.querySelector('.vpanel');
  const shareBox = menu.querySelector('.sharebox');
  const input  = menu.querySelector('.sharebox input');
  const msg    = menu.querySelector('.share-msg');
  const who    = menu.querySelector('.sharebox .share-who');
  const pick   = menu.querySelector('.share-pick');

  const close = () => { panel.classList.remove('open'); shareBox.classList.remove('open'); };

  btn.onclick = e => {
    e.stopPropagation();
    const wasOpen = panel.classList.contains('open');
    document.querySelectorAll('.vpanel.open').forEach(p => {
      p.classList.remove('open');
      p.querySelector('.sharebox').classList.remove('open');
    });
    if (!wasOpen) panel.classList.add('open');
  };
  panel.onclick = e => e.stopPropagation();
  document.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  // public or private — sharing is separate, and survives either
  panel.querySelectorAll('.vopt').forEach(opt => {
    opt.onclick = async () => {
      const want = opt.dataset.set;
      const r = await fetch(`/v1/videos/${id}/visibility`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ visibility: want })
      });
      if (!r.ok) return;
      btn.className = 'vbtn state-' + want;
      menu.querySelector('.vlabel').textContent = LABEL[want];
      close();
    };
  });

  // share — a person, or a group; who has it, with a way to take it back
  menu.querySelector('.vshare').onclick = () => {
    shareBox.classList.toggle('open');
    if (shareBox.classList.contains('open')) { refresh(); input.focus(); }
  };
  async function refresh() {
    const r = await fetch('/v1/grants');
    if (!r.ok) return;
    const { grants } = await r.json();
    who.innerHTML = '';
    grants.filter(g => String(g.video_id) === id).forEach(g => {
      const li = document.createElement('li');
      li.innerHTML = `@${g.handle}${g.accepted ? '' : ' · waiting'}<button title="${g.accepted ? 'Revoke' : 'Withdraw'}">&times;</button>`;
      li.querySelector('button').onclick = async () => {
        await fetch(`/v1/grants/${g.id}`, { method: 'DELETE' });
        refresh(); loadGrants();
      };
      who.appendChild(li);
    });
  }
  async function shareWith(body) {
    msg.textContent = '';
    const r = await fetch('/v1/grants', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ video_id: Number(id) }, body))
    });
    if (r.ok) { input.value = ''; refresh(); loadGrants(); }
    else msg.textContent = (await r.json()).detail || 'Could not share it.';
  }
  const addPerson = () => {
    const h = input.value.trim().replace(/^@/, '');
    if (h) shareWith({ handle: h });
  };
  menu.querySelector('.share-go').onclick = addPerson;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addPerson(); });

  function offerGroups() {
    const keep = pick.value;
    pick.innerHTML = '<option value="">choose a group</option>'
      + GROUPS.map(g => `<option value="${g.id}">${g.name} · ${g.members.length}</option>`).join('');
    pick.value = keep;
  }
  groupOffers.push(offerGroups);
  menu.querySelector('.share-go-group').onclick = () => {
    if (!pick.value) { msg.textContent = GROUPS.length ? 'Choose a group first.' : 'No groups yet — Manage groups… to make one.'; return; }
    shareWith({ group_id: Number(pick.value) });
  };
  menu.querySelector('.share-manage').onclick = e => { e.preventDefault(); openGroups(); };

  // deletion
  menu.querySelector('.vdel').onclick = async () => {
    if (!confirm(`Delete \u201c${menu.dataset.title}\u201d?\n\n`
      + `The video and its skeleton are removed from Dance Sage. `
      + `Anything saved on your phone is not affected. This cannot be undone.`)) return;
    const r = await fetch(`/v1/videos/${id}`, { method: 'DELETE' });
    if (r.ok) { menu.closest('.card').remove(); loadGrants(); }
    else alert('Could not delete that one.');
  };
});

// ── the groups window: make one, add people, take people out ───────────────
const dlg = document.createElement('dialog');
dlg.id = 'groupsDlg';
dlg.innerHTML = `<h3>Groups</h3><div class="list"></div>
  <div class="newrow"><input class="newname" placeholder="New group — a name, e.g. Tuesday bachata"><button class="go newgo">Create</button></div>
  <div class="msg"></div><button class="close">Done</button>`;
document.body.appendChild(dlg);
dlg.querySelector('.close').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
const dmsg = dlg.querySelector('.msg');
async function call(url, method, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' },
                               body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { dmsg.textContent = (await r.json()).detail || 'That did not work.'; return false; }
  dmsg.textContent = ''; return true;
}
function drawGroups() {
  const list = dlg.querySelector('.list');
  list.innerHTML = GROUPS.length ? '' : '<p class="sub" style="font-size:.85rem">No groups yet. Make one below, then add people to it.</p>';
  for (const g of GROUPS) {
    const box = document.createElement('div'); box.className = 'g';
    box.innerHTML = `<div class="gn"><span>${g.name} <a href="/g/${g.id}" style="color:var(--gold);font-weight:500;font-size:.78rem;margin-left:8px">open the wall →</a></span><button class="del">Delete</button></div>
      <ul class="members">${g.members.map(m => `<li>@${m.handle}<button title="Remove" data-h="${m.handle}">&times;</button></li>`).join('')
        || '<li style="opacity:.6;border:none;background:none;padding-left:0">nobody yet</li>'}</ul>
      <div class="addrow"><span style="color:var(--faint);font-size:.85rem">@</span><input placeholder="add a dancer's handle" autocapitalize="none" autocorrect="off"><button class="go add">Add</button></div>`;
    const input = box.querySelector('.addrow input');
    const add = async () => {
      const h = input.value.trim().replace(/^@/, ''); if (!h) return;
      if (await call(`/v1/groups/${g.id}/members`, 'POST', { handle: h })) { input.value = ''; await loadGroups(); }
    };
    box.querySelector('.add').onclick = add;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    box.querySelectorAll('.members button[data-h]').forEach(b => b.onclick = async () => {
      if (await call(`/v1/groups/${g.id}/members/${b.dataset.h}`, 'DELETE')) await loadGroups();
    });
    box.querySelector('.del').onclick = async () => {
      if (!confirm(`Delete the group “${g.name}”? Nothing already shared is taken back.`)) return;
      if (await call(`/v1/groups/${g.id}`, 'DELETE')) await loadGroups();
    };
    list.appendChild(box);
  }
}
dlg.querySelector('.newgo').onclick = async () => {
  const name = dlg.querySelector('.newname').value.trim();
  if (!name) { dmsg.textContent = 'Give the group a name.'; return; }
  if (await call('/v1/groups', 'POST', { name, handles: [] })) { dlg.querySelector('.newname').value = ''; await loadGroups(); }
};
function openGroups() { drawGroups(); dlg.showModal(); }

// ── groups: loaded once, offered to every menu ─────────────────────────────
async function loadGroups() {
  const r = await fetch('/v1/groups');
  if (!r.ok) return;
  GROUPS = (await r.json()).groups;
  groupOffers.forEach(f => f());
  if (dlg.open) drawGroups();
  if (window.renderGroups) window.renderGroups(GROUPS);
}
loadGroups();

// ── who has what: chips on every card, and whatever the page adds ─────────
async function loadGrants() {
  const r = await fetch('/v1/grants');
  if (!r.ok) return;
  const { grants } = await r.json();
  document.querySelectorAll('.vmenu').forEach(menu => {
    const ul = menu.querySelector('.share-who-card');
    if (!ul) return;
    const mine = grants.filter(g => String(g.video_id) === menu.dataset.video);
    ul.innerHTML = mine.map(g =>
      `<li title="${g.accepted ? 'can see this' : 'has not accepted yet'}" style="${g.accepted ? '' : 'opacity:.6'}">@${g.handle}${g.accepted ? '' : ' · waiting'}</li>`).join('');
    ul.style.display = mine.length ? '' : 'none';
  });
  if (window.renderLedger) window.renderLedger(grants);
}
loadGrants();
</script>
