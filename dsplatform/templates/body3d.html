<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ v.title }} · 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap">
<style>
  :root{--bg:#0F1114;--line:#262A31;--text:#F2F1EC;--muted:#8B8E99;--gold:#D99A17}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Outfit,-apple-system,"Helvetica Neue",sans-serif;overflow:hidden}
  #root{position:fixed;inset:0}
  .b3-stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  .b3-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted)}
  .b3-views{position:absolute;left:16px;bottom:82px;display:flex;gap:6px}
  .b3-views button{background:rgba(0,0,0,.55);border:1px solid var(--line);color:var(--muted);font:600 12px Outfit,sans-serif;padding:6px 11px;border-radius:999px;cursor:pointer}
  .b3-bar{position:absolute;left:0;right:0;bottom:0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(15,17,20,.92) 40%);display:flex;gap:14px;align-items:center}
  .b3-bar button{width:42px;height:42px;border-radius:50%;border:none;background:var(--text);color:#000;font-size:17px;cursor:pointer;flex:none}
  .b3-bar input[type=range]{flex:1;accent-color:var(--gold);min-width:0}
  .b3-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:86px;text-align:right}
  .b3-bar label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
  .b3-bar label input{width:90px;flex:none}
  .who{position:absolute;left:16px;top:14px;font-size:13px;color:var(--muted);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  @media (max-width:640px){.b3-bar label{display:none}}
</style>
<div id="root"></div>
<div class="who">{{ v.title }} · {{ track.tier|upper }} · {{ track.engine }}</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/static/body3d.js?v=1"></script>
<script>
mountBody3D(document.getElementById('root'), {{ files|tojson }});
</script>
