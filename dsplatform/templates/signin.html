{% extends "base.html" %}
{% block title %}Sign in · Dance Sage{% endblock %}
{% block body %}
<div style="max-width:380px;margin:40px auto">
  <h1 id="title" style="font-size:1.5rem">Sign in</h1>
  <p class="sub" id="lead">To see everything you have posted — including what is still private.</p>
  <form id="f" style="display:flex;flex-direction:column;gap:11px;margin-top:22px">
    <input id="name" type="text" placeholder="Your name" autocomplete="name" hidden>
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required minlength="6">
    <button type="submit" id="go">Sign in</button>
    <div id="err" style="color:#ff8fa3;font-size:.86rem;min-height:1.2em"></div>
  </form>
  <p class="sub" style="font-size:.9rem;margin-top:18px">
    <span id="switch-lead">New to Dance Sage?</span>
    <a href="#" id="switch" style="color:var(--gold)">Create an account</a></p>
</div>
<style>
  #f input{background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:9px;font-size:.95rem}
  #f input:focus{outline:2px solid var(--gold);outline-offset:1px}
  #f button{background:var(--gold);border:none;color:#241a06;font:600 .92rem system-ui;
    padding:11px;border-radius:9px;cursor:pointer}
  #f button[disabled]{opacity:.6;cursor:default}
</style>
{% endblock %}
{% block js %}
<script src="/static/firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth(initializeApp(window.FIREBASE_CONFIG));
const err = document.getElementById('err');
const $ = id => document.getElementById(id);

// One page, two modes. The server makes the account on the first token it
// sees, so "create" is the same exchange with a name attached; a new account
// then lands on the handle picker, exactly as the app does.
let creating = new URLSearchParams(location.search).get('mode') === 'signup';
function render() {
  $('title').textContent = creating ? 'Create your account' : 'Sign in';
  $('lead').textContent = creating
    ? 'Free. Your name is what other dancers see; you pick a handle next.'
    : 'To see everything you have posted — including what is still private.';
  $('name').hidden = !creating; $('name').required = creating;
  $('pw').autocomplete = creating ? 'new-password' : 'current-password';
  $('go').textContent = creating ? 'Create account' : 'Sign in';
  $('switch-lead').textContent = creating ? 'Already have an account?' : 'New to Dance Sage?';
  $('switch').textContent = creating ? 'Sign in' : 'Create an account';
  err.textContent = '';
}
$('switch').onclick = e => { e.preventDefault(); creating = !creating; render(); };
render();

const MESSAGES = {
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/user-not-found': 'No account with that email — create one below.',
  'auth/wrong-password': 'Wrong email or password.',
  'auth/email-already-in-use': 'There is already an account with that email — sign in instead.',
  'auth/weak-password': 'Use at least 6 characters for the password.',
  'auth/invalid-email': 'That does not look like an email address.',
};

$('f').onsubmit = async e => {
  e.preventDefault();
  const btn = $('go');
  btn.disabled = true; btn.textContent = creating ? 'Creating…' : 'Signing in…'; err.textContent = '';
  try {
    const email = $('email').value, pw = $('pw').value;
    const cred = creating
      ? await createUserWithEmailAndPassword(auth, email, pw)
      : await signInWithEmailAndPassword(auth, email, pw);
    const idToken = await cred.user.getIdToken();
    const body = { idToken };
    if (creating) body.displayName = $('name').value.trim();
    const r = await fetch('/v1/auth/signin', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error((await r.json()).detail || 'Sign-in failed');
    location.href = '/me';
  } catch (ex) {
    err.textContent = MESSAGES[ex.code] || ex.message || String(ex);
    btn.disabled = false; btn.textContent = creating ? 'Create account' : 'Sign in';
  }
};
</script>
{% endblock %}
