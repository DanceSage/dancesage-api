<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Dance Sage{% endblock %}</title>
<style>
  :root{
    --bg:#0c0b0f; --panel:#16141b; --panel2:#1e1b24; --line:#2b2733;
    --text:#efe9f0; --muted:#a099ab; --faint:#7c7487;
    --teal:#3ad6b0; --rose:#ff8fa3; --gold:#f5d06f;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--text);margin:0;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 80px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .brand{display:flex;align-items:center}
  .brand img{height:38px;width:38px;border-radius:9px;object-fit:cover;display:block}
  .top nav{display:flex;gap:18px;font-size:.9rem;color:var(--muted)}
  .top nav a:hover{color:var(--text)}
  h1{font-size:1.9rem;margin:0 0 8px;letter-spacing:-.015em;text-wrap:balance}
  .sub{color:var(--muted);margin:0 0 26px;max-width:60ch}
  .chip{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;
    text-transform:uppercase;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);margin-right:6px}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#241a06;font-weight:600}
  .who{display:flex;gap:22px;align-items:flex-start;margin-bottom:32px;flex-wrap:wrap}
  .who .av{width:104px;height:104px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid var(--line)}
  .who .av.ph{background:var(--panel2);display:grid;place-items:center;
    font:600 2rem system-ui;color:var(--faint)}
  .who .info{flex:1;min-width:240px}
  .who h1{font-size:1.55rem;margin:2px 0 4px}
  .who .loc{color:var(--muted);font-size:.9rem;margin-bottom:10px}
  .who .stats{display:flex;gap:22px;margin:12px 0 12px;font-size:.88rem}
  .who .stats b{display:block;font-size:1.15rem;font-family:var(--mono)}
  .who .stats span{color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.07em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;transition:border-color .15s,transform .15s}
  .card:hover{border-color:#3d3748;transform:translateY(-2px)}
  .card canvas{width:100%;aspect-ratio:3/4;display:block;background:var(--panel2)}
  .card .meta{padding:11px 13px 13px}
  .card .t{font-weight:600;font-size:.94rem;line-height:1.3}
  .card .s{color:var(--muted);font-size:.8rem;margin-top:3px}
  footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--faint);font-size:.82rem}
</style>
</head><body><div class="wrap">
<header class="top">
  <a class="brand" href="/"><img src="/static/logo.jpeg" alt="Dance Sage"></a>
  <nav><a href="/city/toronto">Toronto</a><a href="/me">Your videos</a></nav>
</header>
{% block body %}{% endblock %}
<footer>Every video here was recorded in the Dance Sage app. No skeleton, no post.</footer>
</div><script src="/static/skeleton.js"></script>{% block js %}{% endblock %}
</body></html>
